# starter_v0 — tool declarations (intentionally vague).
# Names and descriptions here are a rough first draft. Routing rules, name->handle
# mapping, arg conventions (news/timeframe/Top), and the send-confirmation boundary
# are NOT spelled out anywhere yet. Your job is to make these declarations + the
# system prompt good enough that the agent routes correctly on the eval.
#
# If you rename a tool, keep the name in sync across:
#   this file  ->  tools/__init__.py (TOOL_FUNCTIONS)  ->  data/eval_base.json + data/eval_research_extension.json
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Gửi một câu hỏi cho người dùng."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu trả lời"}
        options: {type: array, default: [], items: {type: string}, description: "Các lựa chọn"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [screenname]

  - name: social_search
    description: "Tìm bài đăng theo chủ đề trên Twitter/X ở turn hiện tại. Không dùng cho timeline của một tài khoản, và không dùng nếu turn mới nhất đã hủy Twitter hoặc chuyển kênh sang web."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp"}
        limit: {type: integer, default: 5, description: "Số lượng"}
      required: [query]
  - name: lookup
    description: "Tìm kiếm trên web theo intent của turn mới nhất; dùng topic=news cho tin tức. Dùng tool này khi người dùng chuyển từ Twitter/X sang web và không gọi lại social_search cho intent đã bị thay thế."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Truy vấn"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian"}
        max_results: {type: integer, default: 5, description: "Số kết quả"}
      required: [query]
# End of declared tool catalog.
  - name: fetch
    description: "Lấy nội dung từ một địa chỉ."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ"}
      required: [url]

  - name: format
    description: "Trình bày dữ liệu đã có thành văn bản."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách item"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn"}
        headline: {type: string, default: "", description: "Tiêu đề"}
      required: [items, template]

  - name: evidence_audit
    description: "Tool mới của nhóm: kiểm tra chất lượng các source item đã có về độ đa dạng nguồn, URL citation, trùng lặp và nội dung. Không dùng để tìm nguồn mới."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Các source item đã có; mỗi item nên có title/summary, url và source."
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              url: {type: string}
              source: {type: string}
        min_sources: {type: integer, default: 2, description: "Số domain/tài khoản nguồn khác nhau tối thiểu."}
        require_urls: {type: boolean, default: true, description: "Yêu cầu mọi item có URL http(s) hợp lệ."}
      required: [items]

  # ---------------- Team-authored bonus tools ----------------
  - name: source_deduplicate
    description: "Tool mới của nhóm: loại source item trùng theo URL canonical hoặc title, giữ thứ tự và trả duplicate groups để audit. Không tìm nguồn mới và không đánh giá độ tin cậy."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Danh sách source item cần loại trùng."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
        strategy: {type: string, enum: [url, title, url_or_title], default: "url_or_title", description: "Khóa xác định item trùng."}
        preserve_order: {type: boolean, default: true, description: "Giữ thứ tự xuất hiện đầu tiên."}
      required: [items]

  - name: claim_matrix
    description: "Tool mới của nhóm: ánh xạ danh sách claim với các source candidate bằng lexical overlap và nêu rõ đây không phải xác minh sự thật."
    parameters:
      type: object
      properties:
        claims:
          type: array
          description: "Danh sách claim cần ánh xạ."
          items: {type: string}
        sources:
          type: array
          description: "Danh sách source item đã có."
          items:
            type: object
            properties:
              title: {type: string}
              summary: {type: string}
              url: {type: string}
              source: {type: string}
        min_overlap: {type: integer, default: 2, description: "Số meaningful terms trùng tối thiểu."}
        max_sources_per_claim: {type: integer, default: 3, description: "Số candidate tối đa cho mỗi claim."}
      required: [claims, sources]

  - name: citation_export
    description: "Tool mới của nhóm: xuất các source item đã có thành Markdown references, APA-like hoặc BibTeX; không tự tìm hay bịa metadata còn thiếu."
    parameters:
      type: object
      properties:
        items:
          type: array
          description: "Source items cần xuất citation."
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              author: {type: string}
              authors:
                type: array
                items: {type: string}
              date: {type: string}
              published: {type: string}
              year: {type: string}
              summary: {type: string}
        style: {type: string, enum: [markdown, apa, bibtex], default: "markdown", description: "Định dạng citation."}
        include_abstract: {type: boolean, default: false, description: "Kèm summary/note khi có."}
      required: [items]

  # ---------------- Guarded action ----------------
  - name: send
    description: "Gửi nội dung lên Telegram chỉ sau khi người dùng đã xác nhận rõ. Nếu chưa xác nhận, không gọi send; gọi clarify với response_type=yes_no trước."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung"}
        confirmed: {type: boolean, default: false, description: "Chỉ true khi người dùng vừa xác nhận rõ"}
      required: [text]

  # ---------------- Research extension used by the team ----------------
  - name: papers
    description: "Tìm paper khoa học trên arXiv; dùng sort_by=lastUpdatedDate khi người dùng yêu cầu paper mới cập nhật, submittedDate cho paper mới nộp, và relevance cho truy vấn chung."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa"}
        max_results: {type: integer, default: 5, description: "Số lượng"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Sắp xếp"}
      required: [query]

